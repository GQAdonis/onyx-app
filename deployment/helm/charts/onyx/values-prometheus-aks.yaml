# Onyx on the `main` AKS cluster, exposed at https://onyx.prometheusags.ai
# via Envoy Gateway (see ../../gateway/) rather than the chart's nginx Ingress.
#
# Credentials are NOT in this file. They live in pre-created Secrets in the
# `onyx` namespace and are referenced through auth.*.existingSecret.

# --- Image versions ----------------------------------------------------------
# Pinned to a release tag, not `latest`. `latest` is a moving Docker Hub tag, so
# a pod restart could silently land on a different build than the one tested
# here, and there is no tag to roll back to. v4.7.1 is the digest `latest`
# pointed at on 2026-09-08.
#
# `global.version` covers every Onyx-published image (api, webserver, celery
# workers, mcp server, both model servers). Bump this one value to upgrade.
global:
  version: "v4.7.1"

# The code-interpreter sandbox ships on its own release line, so global.version
# does NOT cover it; the subchart defaults its image tag to `latest`. Upstream
# pins it (see docker-compose, #14553) and Chart.yaml already pins the subchart
# to 0.4.6, so the image is pinned to match.
code-interpreter:
  image:
    tag: "0.4.6"

# --- Routing -----------------------------------------------------------------
# The chart's Ingress templates are nginx-specific (rewrite-target, proxy-body-size)
# and it ships no Gateway API templates. Envoy Gateway resources are applied
# separately; both of these stay off.
ingress:
  enabled: false

nginx:
  enabled: false

letsencrypt:
  enabled: false

# --- Storage -----------------------------------------------------------------
# managed-csi-premium is WaitForFirstConsumer + Delete. Deleting the PVCs
# destroys the data; managed-premium-immediate is the Retain equivalent.
persistent:
  storageClassName: managed-csi-premium

# --- Postgres (CloudNativePG, in-cluster, HA) --------------------------------
# The CNPG operator is installed as its OWN Helm release (`cnpg-operator`, with
# fullnameOverride: onyx-cloudnative-pg), so this chart must not try to own the
# operator's resources too. Without this flag the upgrade fails with
# "invalid ownership metadata" on ServiceAccount onyx-cloudnative-pg.
# `postgresql.enabled` stays true: it still gates the Postgres Cluster CR and
# the auth wiring, which this chart does own.
postgresqlOperator:
  enabled: false

postgresql:
  enabled: true
  nameOverride: cloudnative-pg
  crds:
    create: false
  cluster:
    instances: 3
    storage:
      storageClass: managed-csi-premium
      size: 100Gi
    enableSuperuserAccess: true
    superuserSecret:
      name: onyx-postgresql
    # NOTE: templates/postgres-cluster.yaml only reads instances, storage,
    # enableSuperuserAccess, superuserSecret and resources. An `affinity` or
    # `nodeSelector` key here is silently ignored, so Postgres is left to
    # schedule freely. CNPG spreads its 3 instances across nodes on its own.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi

# --- OpenSearch (vector + keyword search) ------------------------------------
opensearch:
  enabled: true
  singleNode: true
  clusterName: "onyx-opensearch"
  nodeGroup: "master"
  masterService: "onyx-opensearch-master"
  replicas: 1
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  persistence:
    enabled: true
    size: 64Gi
    storageClass: managed-csi-premium
  opensearchJavaOpts: "-Xmx4g -Xms4g"
  # agentpool nodes have ~26Gi free; userpool nodes are 45-67% used.
  nodeSelector:
    agentpool: agentpool

vectorDB:
  enabled: true

# --- Redis -------------------------------------------------------------------
redis:
  enabled: true

# --- Object storage ----------------------------------------------------------
minio:
  enabled: true
  existingSecret: onyx-objectstorage
  persistence:
    enabled: true
    size: 30Gi
    storageClass: managed-csi-premium

# --- Onyx MCP server ---------------------------------------------------------
mcpServer:
  enabled: true

# --- Code interpreter sandbox ------------------------------------------------
codeInterpreter:
  enabled: true

# --- Bots (not requested) ----------------------------------------------------
slackbot:
  enabled: false

discordbot:
  enabled: false

# --- Credentials: reference pre-created Secrets ------------------------------
auth:
  postgresql:
    enabled: true
    existingSecret: onyx-postgresql
  redis:
    enabled: true
    existingSecret: onyx-redis
  objectstorage:
    enabled: true
    existingSecret: onyx-objectstorage
  # The opensearch subchart's extraEnvs references the secret `onyx-opensearch`
  # by literal name for OPENSEARCH_INITIAL_ADMIN_PASSWORD, so that name is fixed.
  opensearch:
    enabled: true
    existingSecret: onyx-opensearch
  # Signs password-reset / verification tokens and OAuth/OIDC state. Off by
  # default in the chart for upgrade compatibility; required for a public login.
  userauth:
    enabled: true
    existingSecret: onyx-userauth

# --- Application config ------------------------------------------------------
configMap:
  WEB_DOMAIN: "https://onyx.prometheusags.ai"
  DOMAIN: "onyx.prometheusags.ai"
