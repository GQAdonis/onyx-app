# Envoy Gateway exposure for Onyx at https://onyx.prometheusags.ai
#
# The Onyx Helm chart ships no Gateway API templates — only nginx-specific
# Ingress objects — so these resources are authored and applied separately.
# Shape follows the existing firecrawl-gateway in this cluster.
#
# TLS uses the static ZeroSSL *.prometheusags.ai Secret copied into the `onyx`
# namespace. A listener can only read a Secret in its own namespace without a
# ReferenceGrant, which is why the copy exists.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: onyx-gateway
  namespace: onyx
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: onyx.prometheusags.ai
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: onyx.prometheusags.ai
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: prometheusags-wildcard-tls
            namespace: onyx
---
# Force every plaintext request to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: onyx-https-redirect
  namespace: onyx
spec:
  parentRefs:
    - name: onyx-gateway
      sectionName: http
  hostnames:
    - onyx.prometheusags.ai
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# /api/* -> api-service, with the /api prefix stripped.
# This replaces the chart's nginx `rewrite-target: /$2` annotation. The rule is
# listed before the catch-all because Gateway API matches the most specific
# path prefix first.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: onyx-api
  namespace: onyx
spec:
  parentRefs:
    - name: onyx-gateway
      sectionName: https
  hostnames:
    - onyx.prometheusags.ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: onyx-api-service
          port: 8080
---
# Everything else -> the Next.js web server.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: onyx-web
  namespace: onyx
spec:
  parentRefs:
    - name: onyx-gateway
      sectionName: https
  hostnames:
    - onyx.prometheusags.ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: onyx-webserver
          port: 3000
---
# Restores what the chart's nginx `proxy-body-size: 5G` annotation provided.
#
# NOTE: bufferLimit is a uint32 of bytes, so its ceiling is 4294967295 (~4Gi).
# A value of 5Gi is rejected, and an invalid ClientTrafficPolicy makes Envoy
# serve a synthetic 500 on every attached route instead of failing open.
# 4Gi is the maximum expressible here; uploads above that need a chunked or
# multipart client path rather than a larger buffer.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: onyx-client-traffic
  namespace: onyx
spec:
  # Targets the HTTPS listener by sectionName, NOT the whole Gateway. Every
  # Gateway in this cluster shares one LoadBalancer, so a Gateway-wide policy
  # would land on every other team's port-80 listener too; Envoy rejects that
  # ("applied to multiple http (non https) listeners on the same port"). The
  # http listener only issues redirects, so it needs no buffer tuning.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: onyx-gateway
      sectionName: https
  connection:
    bufferLimit: 4294967295
---
# Long timeouts for slow LLM streaming responses and large indexing calls,
# matching the chart's nginx read/send timeout intent.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: onyx-backend-traffic
  namespace: onyx
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: onyx-api
  timeout:
    http:
      requestTimeout: 600s
